<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>FTW film frame</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../assets/fonts/tg-fonts.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#3b1e1c;color:#f4f4eb;font-family:'Space Grotesk',sans-serif}
.frame{position:relative;width:100vw;height:100vh;overflow:hidden}
img{width:100%;height:100%;object-fit:cover}
header{position:absolute;inset:0 0 auto;background:#3b1e1c;display:flex;justify-content:space-between;align-items:center;padding:19px 28px;height:96px}
h1{font:500 28px 'Space Grotesk',sans-serif;margin:0 0 6px}p{font-size:16px;margin:0;color:#a7d0dc}
.state{font:500 21px 'Space Grotesk',sans-serif;color:#a7d0dc;text-align:right;max-width:42%}
.stamp{position:absolute;top:112px;padding:9px 15px;background:#3b1e1c;color:#f4f4eb;font:500 20px 'Space Grotesk',sans-serif}
.stamp.before{right:20px}.stamp.after{left:20px}
.legend{position:absolute;bottom:50px;left:20px;background:#3b1e1c;padding:10px 13px;font-size:12px;display:none}
.legend i{display:block;width:180px;height:9px;margin:7px 0;background:linear-gradient(90deg,#3b1e1c,#80a0d8,#a7d0dc)}
.legend span{display:flex;justify-content:space-between}
body.panel header{display:none}body.panel .stamp{top:22px;font-size:36px;padding:12px 20px}body.panel .stamp.before{right:24px}body.panel .stamp.after{left:24px}
</style>
<div class="frame"><img id="map" alt=""><header><div><h1></h1><p></p></div><div class="state"></div></header><div class="stamp"></div><div class="legend">Field probability<i></i><span><b>0.5</b><b>1</b></span></div></div>
<script type="module">
const query=new URLSearchParams(location.search);
const data=await (await fetch('../assets/scenes.json')).json();
const scene=data.clips.find(s=>s.id===query.get('scene'));
if(scene.panel) document.body.classList.add('panel');
const side=query.get('side')==='after'?'after':'before';
document.querySelector('h1').textContent=scene.place;
document.querySelector('p').textContent=scene.detail;
document.querySelector('.state').textContent=scene.kind==='edition'?'Edition comparison':scene.kind==='layers'?'Probability → polygons':(scene.years||[2017,2025]).join(' → ');
document.querySelector('.stamp').textContent=scene[`${side}_label`];
document.querySelector('.stamp').classList.add(side);
const img=document.querySelector('img');img.src=`../assets/stills/${scene[side]}.jpg?v=${data.media_version||data.captured}`;img.alt=`${scene.place}, ${scene[`${side}_label`]}`;
if(scene.kind==='probability'||(scene.kind==='layers'&&side==='before'&&scene.channel!=='boundary')) document.querySelector('.legend').style.display='block';
await img.decode();await document.fonts.ready;document.body.dataset.ready='true';
</script>
</html>
