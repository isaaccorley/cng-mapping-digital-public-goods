<script>
(() => {
  function setup() {
    if (!window.Reveal || !Reveal.isReady()) { setTimeout(setup, 50); return; }
    Reveal.configure({autoSlide:0,controls:true});
    async function play(video) {
      video.muted = true;
      video.defaultMuted = true;
      video.playsInline = true;
      video.preload = 'auto';
      try {
        // play() starts loading too; waiting for canplay can strand metadata-only media.
        await video.play();
        if (!Reveal.getCurrentSlide()?.contains(video) || document.visibilityState === 'hidden') {
          video.pause();
        }
      } catch {
        video.controls = true;
      }
    }
    function playback(event) {
      document.querySelectorAll('video').forEach(video => video.pause());
      event.currentSlide.querySelectorAll('video').forEach(video => {
        if (video.readyState > 0) video.currentTime = 0;
        play(video);
      });
    }
    function resume() {
      if (document.visibilityState === 'hidden') return;
      Reveal.getCurrentSlide()?.querySelectorAll('video').forEach(video => {
        if (video.paused) play(video);
      });
    }
    Reveal.on('slidechanged', playback);
    document.addEventListener('visibilitychange', resume);
    window.addEventListener('pageshow', resume);
    window.addEventListener('focus', resume);
    playback({currentSlide:Reveal.getCurrentSlide()});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',setup);
  else setup();
})();
</script>
